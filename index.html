<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102447"><title>CNY to NGN Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#142440;font:16px system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:32px 20px}h1{font-size:28px;margin:8px 0}p{color:#52647d;line-height:1.5}.panel{background:white;border-radius:22px;padding:24px;box-shadow:0 8px 32px #10244712}label{display:block;font-weight:600;margin:18px 0 8px}input{width:100%;font:inherit;font-size:22px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;color:#142440;background:#fff}input:focus{outline:2px solid #2463eb}.result{background:#102447;color:white;border-radius:16px;padding:22px;margin-top:24px}.result small{color:#cbd9f0}output{display:block;font-size:36px;font-weight:750;margin:8px 0;overflow-wrap:anywhere}button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px;cursor:pointer;width:100%;margin-top:12px;background:#2463eb;color:white}button.secondary{background:#edf2fa;color:#142440}button:disabled{opacity:.5}footer{font-size:13px;color:#52647d;text-align:center;margin-top:20px}#status{font-size:13px;min-height:18px;margin:8px 0 0}</style></head><body><main><small>EXCHANGE RATE TOOL</small><h1>CNY to NGN</h1><p>Automatic CNY/USD market rate. Enter your own black market USD/NGN rate.</p><section class="panel"><label for="cny">🇨🇳 Chinese yuan amount (CNY)</label><input id="cny" type="number" inputmode="decimal" min="0" step="any" value="100"><label for="usd">🇺🇸 Equivalent amount (USD)</label><input id="usd" type="number" inputmode="decimal" min="0" step="any" value="15.02"><label for="ngn">🇳🇬 Black market NGN per 1 USD</label><input id="ngn" type="number" inputmode="decimal" min="0" step="any" value="1447"><div class="result"><small>1 CNY equals</small><output id="result" aria-live="polite">₦217.34</output><small id="detail"></small></div><button id="copy">Copy exchange rate</button><button class="secondary" id="refresh">Refresh CNY/USD rate</button><p id="source" role="status">Example CNY/USD rate until refreshed.</p><small>Market rates from <a href="https://www.exchangerate-api.com/">ExchangeRate-API</a>; updated daily, not tick-by-tick.</small><p id="status" role="status"></p></section><footer>USD equivalent × NGN per USD ÷ CNY amount</footer></main><script>const ids=['cny','usd','ngn'],fields=ids.map(id=>document.getElementById(id)),result=document.getElementById('result'),detail=document.getElementById('detail'),copy=document.getElementById('copy'),status=document.getElementById('status');let rate;try{const saved=JSON.parse(localStorage.getItem('cny-ngn-rates'));if(Array.isArray(saved)&&saved.length===3)fields.forEach((f,i)=>f.value=saved[i]);}catch(e){}function update(){const [a,b,c]=fields.map(f=>f.valueAsNumber);rate=b*c/a;const valid=[a,b,c].every(v=>Number.isFinite(v)&&v>0)&&Number.isFinite(rate);result.textContent=valid?'₦'+rate.toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';detail.textContent=valid?'NGN per Chinese yuan':'Enter three positive numbers';copy.disabled=!valid;status.textContent='';try{localStorage.setItem('cny-ngn-rates',JSON.stringify(fields.map(f=>f.value)))}catch(e){}}fields.forEach(f=>f.addEventListener('input',update));const source=document.getElementById('source'), refresh=document.getElementById('refresh');let market=null;try{market=JSON.parse(localStorage.getItem('cny-market-v2'));}catch(e){}function showMarket(){source.textContent=market?'Market rate as of '+new Date(market.time*1000).toLocaleString():'Manual/example rate; not verified live.'}function applyMarket(){if(market&&fields[0].valueAsNumber>0){fields[1].value=Number((fields[0].valueAsNumber*market.rate).toPrecision(12));update();showMarket()}}fields[0].addEventListener('input',applyMarket);fields[1].addEventListener('input',()=>{market=null;try{localStorage.removeItem('cny-market-v2')}catch(e){}showMarket()});async function fetchRate(){refresh.disabled=true;source.textContent='Fetching market rate…';try{const r=await fetch('https://open.er-api.com/v6/latest/CNY',{cache:'no-store'});if(!r.ok)throw Error('HTTP');const d=await r.json();if(d.result!=='success'||!Number.isFinite(d.rates?.USD)||d.rates.USD<=0||!Number.isFinite(d.time_last_update_unix))throw Error('Invalid rate');market={rate:d.rates.USD,time:d.time_last_update_unix};try{localStorage.setItem('cny-market-v2',JSON.stringify(market))}catch(e){}applyMarket();showMarket()}catch(e){showMarket();source.textContent='Refresh failed. '+source.textContent+' You can enter the USD amount manually.'}finally{refresh.disabled=false}}refresh.onclick=fetchRate;applyMarket();fetchRate();copy.onclick=async()=>{const value=rate.toFixed(2);try{await navigator.clipboard.writeText(value);status.textContent='Copied: '+value}catch(e){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();try{status.textContent=document.execCommand('copy')?'Copied: '+value:'Copy manually: '+value}catch(e){status.textContent='Copy manually: '+value}t.remove()}};update();</script></body></html>
